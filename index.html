<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KitchenLog — Operasional Harian Dapur</title>
    <meta name="description" content="Aplikasi operasional harian dapur untuk absensi staf per shift, laporan kebersihan berbasis foto, serah terima, dan pelaporan barang." />
    <meta property="og:title" content="KitchenLog — Operasional Harian Dapur" />
    <meta property="og:description" content="Catat kehadiran per shift, laporan kebersihan dengan foto, serah terima, dan barang rusak atau hilang." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Mode demo dipilih lewat ?demo=1 (mis. http://localhost:3000/?demo=1).
      Mode demo memuat data contoh di memori dan tidak menyentuh Firebase.
      Tanpa parameter itu, aplikasi berjalan normal dengan Firebase.
    -->
    <script type="module">
      const isDemo = new URLSearchParams(location.search).get('demo') === '1';
      const entry = isDemo ? '/src/main-demo.tsx' : '/src/main.tsx';
      if (isDemo) document.title = 'KitchenLog — Mode Demo';
      const s = document.createElement('script');
      s.type = 'module';
      s.src = entry;
      document.body.appendChild(s);
    </script>
  </body>
</html>
